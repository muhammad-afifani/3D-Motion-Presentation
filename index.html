<html lang="en">
  <head>

    <!-- tema (bagian B): dipasang sebelum CSS agar tidak berkedip; Dark bila belum dipilih atau storage diblokir -->
    <script>try{if(localStorage.getItem('etel:theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
